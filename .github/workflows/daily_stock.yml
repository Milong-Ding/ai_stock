name: Daily Stock AI Report

on:
  schedule:
    # 每天台灣時間 14:30 自動執行 (UTC 06:30)
    - cron: '30 6 * * 1-5'
  workflow_dispatch: # 支援手動按鈕觸發測試

jobs:
  run-ai-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas google-genai requests

      - name: 執行 AI 股市分析並發送 LINE
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python stock_ai_bot.py